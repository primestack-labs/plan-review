<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.0/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>{{css}}</style>
<script>{ const t = document.cookie.match(/(?:^|; )plan-review-theme=(light|dark)/)?.[1]; if (t) document.documentElement.dataset.theme = t; }</script>
</head>
<body>
{{body}}
<div id="popover" hidden>
  <textarea id="comment-text" rows="3" placeholder="Your comment"></textarea>
  <div class="actions"><button id="comment-prev" title="Previous comment">‹</button><button id="comment-next" title="Next comment">›</button><span class="spacer"></span><button id="comment-cancel">Cancel</button><button id="comment-save">Add comment</button></div>
</div>
<script id="review-data" type="application/json">{{data}}</script>
<script type="module">
{{state}}
{{js}}
</script>
</body>
</html>
